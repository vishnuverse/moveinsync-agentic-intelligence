# Data Contract Layer (plan §3)
#
# Maps logical entity/column names -- the only names sense/reason/act nodes,
# dashboard queries, and metric calculations are allowed to reference -- to the
# physical table/column names of whatever Postgres schema is actually attached.
#
# This file IS the default/reference contract shipped with the repo. It points
# at the schema defined in backend/db/schema.sql and populated by
# backend/db/seed/generate.py. When real MoveInSync data lands, point Postgres
# at it, edit this file to the real table/column names, and nothing else in
# the codebase should need to change (see plan §3's decoupling proof test).
#
# Loaded by backend/app/contracts/loader.py via contract.entity("trip").column("scheduled_time").

version: 1
default_org_id: moveinsync-demo

entities:
  trip:
    table: route_trips
    columns:
      id: id
      org_id: org_id
      route_id: route_id
      driver_id: driver_id
      trip_date: trip_date
      scheduled_departure: scheduled_departure
      scheduled_time: scheduled_arrival
      actual_departure: actual_departure
      actual_time: actual_arrival
      passenger_count: passenger_count
      status: status
      created_at: created_at

  cost:
    table: route_costs
    columns:
      id: id
      org_id: org_id
      route_id: route_id
      vendor_id: vendor_id
      trip_id: trip_id
      cost_date: cost_date
      distance_km: distance_km
      passenger_count: passenger_count
      amount: total_cost_inr
      cost_per_km: cost_per_km_inr
      category: cost_category
      created_at: created_at

  incident:
    table: safety_incidents
    columns:
      id: id
      org_id: org_id
      trip_id: trip_id
      route_id: route_id
      driver_id: driver_id
      incident_type: incident_type
      severity: severity
      description: description
      occurred_at: occurred_at
      reported_at: reported_at
      status: status
      created_at: created_at

  emission:
    table: emissions_log
    columns:
      id: id
      org_id: org_id
      route_id: route_id
      trip_id: trip_id
      log_date: log_date
      distance_km: distance_km
      passenger_count: passenger_count
      co2_grams: co2_grams
      co2_per_passenger_km: co2_per_passenger_km
      vehicle_type: vehicle_type
      created_at: created_at

  commute:
    table: commute_logs
    columns:
      id: id
      org_id: org_id
      employee_id: employee_id
      trip_id: trip_id
      route_id: route_id
      log_date: log_date
      boarding_time: boarding_time
      alighting_time: alighting_time
      mode: mode
      status: status
      created_at: created_at

  attendance:
    table: attendance_records
    columns:
      id: id
      org_id: org_id
      employee_id: employee_id
      work_date: work_date
      clock_in_time: clock_in_time
      clock_out_time: clock_out_time
      status: status
      late_minutes: late_minutes
      created_at: created_at

  vendor:
    table: vendors
    columns:
      id: id
      org_id: org_id
      name: name
      contract_start: contract_start_date
      contract_end: contract_end_date
      sla_target_pct: sla_target_pct
      cost_per_km: cost_per_km_inr
      region: region
      status: status
      created_at: created_at

  employee:
    table: employees
    columns:
      id: id
      org_id: org_id
      employee_code: employee_code
      name: full_name
      email: email
      team_id: team_id
      line_manager_id: line_manager_id
      home_location: home_location
      work_location: work_location
      status: status
      created_at: created_at

  route:
    table: routes
    columns:
      id: id
      org_id: org_id
      route_code: route_code
      name: name
      origin: origin
      destination: destination
      region: region
      vendor_id: vendor_id
      scheduled_distance_km: scheduled_distance_km
      shift_type: shift_type
      status: status
      created_at: created_at

  team:
    table: teams
    columns:
      id: id
      org_id: org_id
      name: name
      region: region
      line_manager_id: line_manager_id
      created_at: created_at

  driver:
    table: drivers
    columns:
      id: id
      org_id: org_id
      vendor_id: vendor_id
      driver_code: driver_code
      name: full_name
      license_number: license_number
      phone: phone
      status: status
      created_at: created_at

  # act-layer outputs (backend/app/graph/act/) -- the UI notification inbox
  # and report library both read through these two entities. Added by the
  # act subgraph build; kept in lockstep with backend/db/schema.sql.
  notification:
    table: agent_notifications
    columns:
      id: id
      org_id: org_id
      persona: persona
      scope: scope
      severity: severity
      title: title
      message: message
      related_entity_type: related_entity_type
      related_entity_id: related_entity_id
      status: status
      thread_id: thread_id
      created_at: created_at
      updated_at: updated_at

  report:
    table: agent_reports
    columns:
      id: id
      org_id: org_id
      report_type: report_type
      persona: persona
      title: title
      period_start: period_start
      period_end: period_end
      storage_ref: storage_ref
      format: format
      thread_id: thread_id
      generated_at: generated_at
      created_at: created_at

  # research_agent's grounding source (plan §8 curated static benchmarks) --
  # added by the supervisor-assembly agent (backend/app/graph/supervisor.py)
  # while wiring the reason subgraph; additive only, does not touch any
  # existing entity above.
  benchmark:
    table: sustainability_targets
    columns:
      id: id
      org_id: org_id
      metric_name: metric_name
      target_value: target_value
      threshold_value: threshold_value
      unit: unit
      period: period
      notes: notes
      created_at: created_at
