# Data Contract Layer (plan §3) -- REAL-DATA CONTRACT
#
# Maps logical entity/column names -- the only names sense/reason/act nodes,
# dashboard queries, and metric calculations are allowed to reference -- to
# the physical table/column names of whatever Postgres schema is actually
# attached. This is now the DEFAULT file loader.py reads.
#
# This file points at the `mis` schema (backend/db/real_data/mis_schema.sql),
# populated from the real MoveInSync dataset in data/*.csv by
# backend/db/real_data/ingest.py -- see backend/db/real_data/README.md for
# the full pipeline and backend/db/real_data/mis_schema.sql for exactly how
# each table was derived (what's real vs. synthesized -- team/line-manager
# hierarchy, the driver dimension, and emission factors are all clearly
# flagged there).
#
# Every logical entity/column KEY here is identical to
# backend/config/data_contract.synthetic.yaml (the preserved fallback this
# file replaced as the default) -- only the physical table/column targets
# changed, plus one new entity (`feedback`) that is purely additive. Nothing
# in backend/app/graph/{sense,reason,act}/ needed to change. `notification`
# and `report` are act-layer output tables (backend/app/graph/act/), not raw
# business data, and are unaffected by the real-data migration -- they stay
# on `public.agent_notifications` / `public.agent_reports`.
#
# To go back to the synthetic seed data at any time:
#   DATA_CONTRACT_PATH=backend/config/data_contract.synthetic.yaml <run backend>
# (backend/app/contracts/loader.py already reads this env var; see its
# _CONTRACT_PATH_ENV_VAR / _DEFAULT_CONTRACT_PATH.)

version: 2
default_org_id: vanta-Aus  # one of the 5 real business units (see below); used only as a fallback scope when no org is specified

entities:
  trip:
    table: mis.trip
    columns:
      id: id
      org_id: org_id
      route_id: route_id
      driver_id: driver_id
      trip_date: trip_date
      scheduled_departure: scheduled_departure
      scheduled_time: scheduled_arrival
      actual_departure: actual_departure
      actual_time: actual_arrival
      passenger_count: passenger_count
      status: status
      created_at: created_at
      # Additive (PRD v3 F1/F2). trip_direction/traveled_km are real physical
      # columns on mis.trip that were simply never mapped before. actual_escort
      # is real in the raw ride_data_trip CSVs and stg.ride_trip, but
      # mis_schema.sql/transform.sql (off-limits -- see backend/db/migrations/
      # 001_add_escort_and_ack_time.sql) never carried it into mis.trip, so
      # it only exists on mis.trip after that migration has been applied
      # post-ingest.
      trip_direction: trip_direction
      traveled_km: traveled_km
      actual_escort: actual_escort

  cost:
    table: mis.cost
    columns:
      id: id
      org_id: org_id
      route_id: route_id
      vendor_id: vendor_id
      trip_id: trip_id
      cost_date: cost_date
      distance_km: distance_km
      passenger_count: passenger_count
      amount: total_cost_inr
      cost_per_km: cost_per_km_inr
      category: cost_category
      created_at: created_at
      # Additive (PRD v3 F2 billing-slab auditor): real physical column
      # already on mis.cost (bill_data.slab_name), just never mapped before.
      slab_name: slab_name

  incident:
    table: mis.incident
    columns:
      id: id
      org_id: org_id
      trip_id: trip_id
      route_id: route_id
      driver_id: driver_id
      incident_type: incident_type
      severity: severity
      description: description
      occurred_at: occurred_at
      reported_at: reported_at
      status: status
      created_at: created_at
      # Additive (PRD v3 F1 "Critical Response Time" formula). acknowledge_time
      # is real in alerts_data/stg.alerts_data but transform.sql (off-limits)
      # never carried it into mis.incident (reported_at is a same-as-occurred_at
      # placeholder, not a real ack timestamp) -- only present on mis.incident
      # after backend/db/migrations/001_add_escort_and_ack_time.sql is applied
      # post-ingest.
      acknowledge_time: acknowledge_time

  emission:
    table: mis.emission
    columns:
      id: id
      org_id: org_id
      route_id: route_id
      trip_id: trip_id
      log_date: log_date
      distance_km: distance_km
      passenger_count: passenger_count
      co2_grams: co2_grams
      co2_per_passenger_km: co2_per_passenger_km
      vehicle_type: vehicle_type
      created_at: created_at

  commute:
    table: mis.commute
    columns:
      id: id
      org_id: org_id
      employee_id: employee_id
      trip_id: trip_id
      route_id: route_id
      log_date: log_date
      boarding_time: boarding_time
      alighting_time: alighting_time
      mode: mode
      status: status
      created_at: created_at

  attendance:
    table: mis.attendance
    columns:
      id: id
      org_id: org_id
      employee_id: employee_id
      work_date: work_date
      clock_in_time: clock_in_time
      clock_out_time: clock_out_time
      status: status
      late_minutes: late_minutes
      created_at: created_at

  vendor:
    table: mis.vendor
    columns:
      id: id
      org_id: org_id
      name: name
      contract_start: contract_start_date
      contract_end: contract_end_date
      sla_target_pct: sla_target_pct
      cost_per_km: cost_per_km_inr
      region: region
      status: status
      created_at: created_at

  employee:
    table: mis.employee
    columns:
      id: id
      org_id: org_id
      employee_code: employee_code
      name: full_name
      email: email
      team_id: team_id
      line_manager_id: line_manager_id
      home_location: home_location
      work_location: work_location
      status: status
      created_at: created_at
      # Additive (PRD v3 F1 escort-compliance auditor): real physical column
      # already on mis.employee (modal emp_data.gender per stwid), just never
      # mapped before.
      gender: gender

  route:
    table: mis.route
    columns:
      id: id
      org_id: org_id
      route_code: route_code
      name: name
      origin: origin
      destination: destination
      region: region
      vendor_id: vendor_id
      scheduled_distance_km: scheduled_distance_km
      shift_type: shift_type
      status: status
      created_at: created_at

  team:
    table: mis.team
    columns:
      id: id
      org_id: org_id
      name: name
      region: region
      line_manager_id: line_manager_id
      created_at: created_at

  driver:
    table: mis.driver
    columns:
      id: id
      org_id: org_id
      vendor_id: vendor_id
      driver_code: driver_code
      name: full_name
      license_number: license_number
      phone: phone
      status: status
      created_at: created_at

  # act-layer outputs (backend/app/graph/act/) -- unaffected by the real-data
  # migration, unchanged from data_contract.synthetic.yaml.
  notification:
    table: agent_notifications
    columns:
      id: id
      org_id: org_id
      persona: persona
      scope: scope
      severity: severity
      title: title
      message: message
      related_entity_type: related_entity_type
      related_entity_id: related_entity_id
      status: status
      thread_id: thread_id
      created_at: created_at
      updated_at: updated_at

  report:
    table: agent_reports
    columns:
      id: id
      org_id: org_id
      report_type: report_type
      persona: persona
      title: title
      period_start: period_start
      period_end: period_end
      storage_ref: storage_ref
      format: format
      thread_id: thread_id
      generated_at: generated_at
      created_at: created_at

  # NEW entity -- not part of the original synthetic contract. Additive only:
  # route/driver/cab/safety/marshal ratings from trip_feedback.csv, doesn't
  # change the shape of any existing entity above.
  feedback:
    table: mis.feedback
    columns:
      id: id
      org_id: org_id
      trip_id: trip_id
      employee_id: employee_id
      trip_type: trip_type
      trip_date: trip_date
      route_rating: route_rating
      driver_rating: driver_rating
      cab_rating: cab_rating
      safety_rating: safety_rating
      marshal_rating: marshal_rating
      creation_time: creation_time
      created_at: created_at

  # Infra/reference entities (not part of the real-vs-synthetic operational
  # data swap -- these always live in the app's own `public` schema
  # regardless of which data_contract is active). Carried over during the
  # real-data-ingestion merge, which branched before these existed.
  benchmark:
    table: sustainability_targets
    columns:
      id: id
      org_id: org_id
      metric_name: metric_name
      target_value: target_value
      threshold_value: threshold_value
      unit: unit
      period: period
      notes: notes
      created_at: created_at

  pipeline_run:
    table: pipeline_runs
    columns:
      id: id
      org_id: org_id
      persona: persona
      action: action
      thread_id: thread_id
      triggered_by: triggered_by
      created_at: created_at
