# Data Contract Layer (plan §3) -- REAL-DATA CONTRACT
#
# Maps logical entity/column names -- the only names sense/reason/act nodes,
# dashboard queries, and metric calculations are allowed to reference -- to
# the physical table/column names of whatever Postgres schema is actually
# attached. This is now the DEFAULT file loader.py reads.
#
# This file points at the `mis` schema (backend/db/real_data/mis_schema.sql),
# populated from the real MoveInSync dataset in data/*.csv by
# backend/db/real_data/ingest.py -- see backend/db/real_data/README.md for
# the full pipeline and backend/db/real_data/mis_schema.sql for exactly how
# each table was derived (what's real vs. synthesized -- team/line-manager
# hierarchy, the driver dimension, and emission factors are all clearly
# flagged there).
#
# This is the ONLY data contract now -- the project runs solely on the real
# `mis.*` dataset (the former synthetic contract and the public.* business
# tables were removed). `notification` and `report` are act-layer output
# tables (backend/app/graph/act/), not raw business data -- they stay on
# `public.agent_notifications` / `public.agent_reports`. loader.py still reads
# a DATA_CONTRACT_PATH env var, so this contract can be repointed at any other
# real Postgres schema by supplying a different mapping file -- that's the
# decoupling: change this one file, no code changes.

version: 2
default_org_id: vanta-Aus  # one of the 5 real business units (see below); used only as a fallback scope when no org is specified

entities:
  trip:
    table: mis.trip
    description: employee cab trips with scheduled vs. actual departure/arrival times, delays, punctuality/OTA, and escort compliance
    columns:
      id: id
      org_id: org_id
      route_id: route_id
      driver_id: driver_id
      trip_date: trip_date
      scheduled_departure: scheduled_departure
      scheduled_time: scheduled_arrival
      actual_departure: actual_departure
      actual_time: actual_arrival
      passenger_count: passenger_count
      status: status
      created_at: created_at
      # Additive (PRD v3 F1/F2). trip_direction/traveled_km are real physical
      # columns on mis.trip that were simply never mapped before. actual_escort
      # is real in the raw ride_data_trip CSVs and stg.ride_trip, but
      # mis_schema.sql/transform.sql (off-limits -- see backend/db/migrations/
      # 001_add_escort_and_ack_time.sql) never carried it into mis.trip, so
      # it only exists on mis.trip after that migration has been applied
      # post-ingest.
      trip_direction: trip_direction
      traveled_km: traveled_km
      actual_escort: actual_escort
      # Additive for chart aggregation queries (backend/app/services/chart_data.py)
      # -- not read by any sense/reason/act node, so adding them here doesn't
      # touch that code path at all.
      delay_reason: delay_reason
      delay_minutes: delay_minutes
      # Additive (SP-B §B2 detect_variability_signal): real physical column
      # already on mis.trip, just never mapped before -- needed to compute
      # the route's planned-vs-traveled distance variance.
      planned_km: planned_km
      # Additive (SP-B §9b aggregated_insights.py flagged_drivers): real
      # physical columns already on mis.trip, just never mapped before.
      is_driver_nc: is_driver_nc
      is_cab_nc: is_cab_nc

  cost:
    table: mis.cost
    description: per-trip and per-route transportation costs, cost-per-km, billing slabs, and vendor spend
    columns:
      id: id
      org_id: org_id
      route_id: route_id
      vendor_id: vendor_id
      trip_id: trip_id
      cost_date: cost_date
      distance_km: distance_km
      passenger_count: passenger_count
      amount: total_cost_inr
      cost_per_km: cost_per_km_inr
      category: cost_category
      created_at: created_at
      # Additive (PRD v3 F2 billing-slab auditor): real physical column
      # already on mis.cost (bill_data.slab_name), just never mapped before.
      slab_name: slab_name

  incident:
    table: mis.incident
    description: safety incidents and panic/SOS alerts raised on trips, their severity, type, and response/acknowledgement times
    columns:
      id: id
      org_id: org_id
      trip_id: trip_id
      route_id: route_id
      driver_id: driver_id
      incident_type: incident_type
      severity: severity
      description: description
      occurred_at: occurred_at
      reported_at: reported_at
      status: status
      created_at: created_at
      # Additive (PRD v3 F1 "Critical Response Time" formula). acknowledge_time
      # is real in alerts_data/stg.alerts_data but transform.sql (off-limits)
      # never carried it into mis.incident (reported_at is a same-as-occurred_at
      # placeholder, not a real ack timestamp) -- only present on mis.incident
      # after backend/db/migrations/001_add_escort_and_ack_time.sql is applied
      # post-ingest.
      acknowledge_time: acknowledge_time

  emission:
    table: mis.emission
    description: per-trip CO2 emissions, carbon footprint, emissions per passenger-km, and vehicle/fuel type
    columns:
      id: id
      org_id: org_id
      route_id: route_id
      trip_id: trip_id
      log_date: log_date
      distance_km: distance_km
      passenger_count: passenger_count
      co2_grams: co2_grams
      co2_per_passenger_km: co2_per_passenger_km
      vehicle_type: vehicle_type
      created_at: created_at
      # Additive for the transport-head emissions-by-fuel-type chart (Diesel
      # /Petrol/Electric, PRD Feature 5) -- vehicle_type above only carries
      # the coarser EV/ICE split.
      fuel_type: fuel_type

  commute:
    table: mis.commute
    description: employee commute/ridership records - boarding and no-show behaviour on cab trips
    columns:
      id: id
      org_id: org_id
      employee_id: employee_id
      trip_id: trip_id
      route_id: route_id
      log_date: log_date
      boarding_time: boarding_time
      alighting_time: alighting_time
      mode: mode
      status: status
      created_at: created_at
      # Additive for the line-manager absence-split chart (backend/app/services/chart_data.py).
      is_no_show: is_no_show
      not_boarding_reason: not_boarding_reason

  attendance:
    table: mis.attendance
    description: employee workplace attendance - clock-in/out times and lateness, used to correlate attendance with transport
    columns:
      id: id
      org_id: org_id
      employee_id: employee_id
      work_date: work_date
      clock_in_time: clock_in_time
      clock_out_time: clock_out_time
      status: status
      late_minutes: late_minutes
      created_at: created_at

  vendor:
    table: mis.vendor
    description: transport vendors/cab suppliers, their SLA targets, contract dates, regions, and cost rates
    columns:
      id: id
      org_id: org_id
      name: name
      contract_start: contract_start_date
      contract_end: contract_end_date
      sla_target_pct: sla_target_pct
      cost_per_km: cost_per_km_inr
      region: region
      status: status
      created_at: created_at

  employee:
    table: mis.employee
    description: employees who use the transport service, their team/line-manager, home/work locations, and gender
    columns:
      id: id
      org_id: org_id
      employee_code: employee_code
      name: full_name
      email: email
      team_id: team_id
      line_manager_id: line_manager_id
      home_location: home_location
      work_location: work_location
      status: status
      created_at: created_at
      # Additive (PRD v3 F1 escort-compliance auditor): real physical column
      # already on mis.employee (modal emp_data.gender per stwid), just never
      # mapped before.
      gender: gender

  route:
    table: mis.route
    description: cab routes with origin/destination, region, assigned vendor, scheduled distance, and shift type
    columns:
      id: id
      org_id: org_id
      route_code: route_code
      name: name
      origin: origin
      destination: destination
      region: region
      vendor_id: vendor_id
      scheduled_distance_km: scheduled_distance_km
      shift_type: shift_type
      status: status
      created_at: created_at

  team:
    table: mis.team
    description: employee teams and their line-manager/region groupings
    columns:
      id: id
      org_id: org_id
      name: name
      region: region
      line_manager_id: line_manager_id
      created_at: created_at

  driver:
    table: mis.driver
    description: cab drivers, the vendor they belong to, and their licence/contact details
    columns:
      id: id
      org_id: org_id
      vendor_id: vendor_id
      driver_code: driver_code
      name: full_name
      license_number: license_number
      phone: phone
      status: status
      created_at: created_at

  # act-layer outputs (backend/app/graph/act/) -- unaffected by the real-data
  # migration, unchanged from data_contract.synthetic.yaml.
  notification:
    table: agent_notifications
    columns:
      id: id
      org_id: org_id
      persona: persona
      scope: scope
      severity: severity
      title: title
      message: message
      related_entity_type: related_entity_type
      related_entity_id: related_entity_id
      status: status
      thread_id: thread_id
      created_at: created_at
      updated_at: updated_at
      # SP-B additions (db/migrations/003/004/005; also on schema.sql's fresh-
      # db definition of agent_notifications directly).
      is_false_positive: is_false_positive
      false_positive_note: false_positive_note
      false_positive_marked_at: false_positive_marked_at
      scheduled_for: scheduled_for
      escalated_at: escalated_at
      escalated_to_persona: escalated_to_persona

  report:
    table: agent_reports
    columns:
      id: id
      org_id: org_id
      report_type: report_type
      persona: persona
      title: title
      period_start: period_start
      period_end: period_end
      storage_ref: storage_ref
      format: format
      thread_id: thread_id
      generated_at: generated_at
      created_at: created_at

  # NEW entity -- not part of the original synthetic contract. Additive only:
  # route/driver/cab/safety/marshal ratings from trip_feedback.csv, doesn't
  # change the shape of any existing entity above.
  feedback:
    table: mis.feedback
    description: employee trip feedback ratings for route, driver, cab, safety, and marshal
    columns:
      id: id
      org_id: org_id
      trip_id: trip_id
      employee_id: employee_id
      trip_type: trip_type
      trip_date: trip_date
      route_rating: route_rating
      driver_rating: driver_rating
      cab_rating: cab_rating
      safety_rating: safety_rating
      marshal_rating: marshal_rating
      creation_time: creation_time
      created_at: created_at

  # Infra/reference entities (not part of the real-vs-synthetic operational
  # data swap -- these always live in the app's own `public` schema
  # regardless of which data_contract is active). Carried over during the
  # real-data-ingestion merge, which branched before these existed.
  benchmark:
    table: sustainability_targets
    columns:
      id: id
      org_id: org_id
      metric_name: metric_name
      target_value: target_value
      threshold_value: threshold_value
      unit: unit
      period: period
      notes: notes
      created_at: created_at

  pipeline_run:
    table: pipeline_runs
    columns:
      id: id
      org_id: org_id
      persona: persona
      action: action
      thread_id: thread_id
      triggered_by: triggered_by
      created_at: created_at

  chat_thread:
    table: chat_threads
    columns:
      id: id
      org_id: org_id
      persona: persona
      title: title
      scope_entity_type: scope_entity_type
      scope_entity_id: scope_entity_id
      created_at: created_at
      updated_at: updated_at

  # SP-B additions (backend/db/api_schema.sql) -- gate/rules infra, same
  # `public` scoping as pipeline_run/chat_thread above (runtime-editable
  # policy + runtime-written audit rows, not business data).
  gate_decision:
    table: gate_decisions
    description: audit trail of every suppress/rule-only/escalate decision the LLM-filtering gate made, one row per (signal, persona) evaluation
    columns:
      id: id
      org_id: org_id
      persona: persona
      signal_type: signal_type
      scope: scope
      entity_id: entity_id
      severity: severity
      action: action
      reason: reason
      matched_rule: matched_rule
      confidence: confidence
      thread_id: thread_id
      created_at: created_at

  alert_rule:
    table: alert_rules
    description: per-org, per-signal-type configurable detector thresholds, gate mode, and notification cadence (Settings page)
    columns:
      id: id
      org_id: org_id
      signal_type: signal_type
      params: params
      gate_mode: gate_mode
      notification_cadence: notification_cadence
      updated_at: updated_at
      updated_by: updated_by

  gate_setting:
    table: gate_settings
    description: per-org global gate policy -- recurrence/suppression-heartbeat/rule-only-eligibility knobs and escalation-hierarchy timeouts
    columns:
      org_id: org_id
      recurrence_window_hours: recurrence_window_hours
      recurrence_suppress_after: recurrence_suppress_after
      max_consecutive_suppressions: max_consecutive_suppressions
      rule_only_margin_ratio: rule_only_margin_ratio
      max_fp_rate_for_rule_only: max_fp_rate_for_rule_only
      min_confidence_for_rule_only: min_confidence_for_rule_only
      max_healthy_suppression_rate: max_healthy_suppression_rate
      escalation_after_hours_critical: escalation_after_hours_critical
      escalation_after_hours_high: escalation_after_hours_high
      escalation_after_hours_medium: escalation_after_hours_medium
      updated_at: updated_at
      updated_by: updated_by
